ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }

    application {
        modules = [ com.connorhansen.publiclandmap.api.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/publiclandmap"
    url = ${?DATABASE_URL}
    user = "publiclandmap"
    user = ${?DB_USER}
    # No default: set DB_PASSWORD (see backend/.env.example)
    password = ${?DB_PASSWORD}
    maxPoolSize = 10
    maxPoolSize = ${?DB_MAX_POOL_SIZE}
}

offline {
    tilesDir = "/tiles/offline"
    tilesDir = ${?OFFLINE_TILES_DIR}
}
